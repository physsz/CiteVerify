[project]
name = "citeverify"
version = "0.1.0"
description = "Evidence-based reference verification for scholarly citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Song" }
]
dependencies = [
  "bibtexparser>=1.4.3",
  "httpx[socks]>=0.27.0",
  "pydantic>=2.7.0",
  "python-slugify>=8.0.4",
  "rapidfuzz>=3.9.0",
  "rich>=13.7.0",
  "tenacity>=8.2.3",
  "typer>=0.12.3",
]

[project.scripts]
citeverify = "citeverify.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: live provider tests that may use network access",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
packages = ["citeverify"]
